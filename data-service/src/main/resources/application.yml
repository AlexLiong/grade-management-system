server:
  port: ${DATA_SERVICE_PORT:9442}
  address: ${BIND_ADDRESS:127.0.0.1}
  ssl:
    enabled: true
    key-store: ./.runtime/localhost.p12
    key-store-password: ${TLS_PASSWORD:campus-dev-tls-2024}
    key-store-type: PKCS12
  error:
    include-message: never
    include-binding-errors: never

spring:
  datasource:
    # 整库加密：CIPHER=AES + 「文件口令 用户口令」两段式会话口令。
    # 口令不写在这里，而是由 common/DbCredentials.java 从 .runtime/secrets.json
    # （或环境变量 / -D 启动参数）解析后注入，见 ConfigEnvironmentPostProcessor。
    # 换库时用 DB_URL / DB_USER / DB_PASSWORD 覆盖即可。
    url: jdbc:h2:file:./.runtime/database/campus;CIPHER=AES;AUTO_SERVER=TRUE
    username: sa
    password:
    hikari:
      maximum-pool-size: 8
campus:
  GATEWAY_URL: ${GATEWAY_URL:https://localhost:8443}
  AUDIT_KEY: ${AUDIT_KEY:}
  LEDGER_KEY: ${LEDGER_KEY:}
  AUDIT_DATA_KEY: ${AUDIT_DATA_KEY:}
  DATA_KEY: ${DATA_KEY:}
  BUSINESS_KEY: ${BUSINESS_KEY:}
