<html lang="zh-CN">

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#173f35" />

    <title>高校成绩管理工作台</title>
    <style>
      .boot-screen { min-height: 100vh; display: grid; place-items: center; color: #52635d; background: #f3f5f4; font: 13px system-ui, sans-serif; }
      .boot-screen span { display: inline-flex; align-items: center; gap: 9px; }
      .boot-screen i { width: 18px; height: 18px; border: 2px solid #b9cdc6; border-top-color: #176b55; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <div id="app"><div class="boot-screen"><span><i></i>正在验证会话</span></div></div>
