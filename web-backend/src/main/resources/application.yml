server:
  port: ${WEB_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
spring:
  application:
    name: secure-grade-web
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      file-size-threshold: 6MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  trust-proxy: ${TRUST_PROXY:false}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-key-file: ${JWT_KEY_FILE:runtime/jwt.key}
    token-ttl: ${JWT_TTL:PT2H}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:10}
  crypto:
    master-key: ${GRADE_MASTER_KEY:}
    key-file: ${GRADE_KEY_FILE:runtime/grade-data.key}
rmi:
  host: ${RMI_HOST:127.0.0.1}
  port: ${RMI_PORT:1199}
  tls-enabled: ${RMI_TLS_ENABLED:false}
  hmac-secret: ${RMI_HMAC_SECRET:}
  hmac-key-file: ${RMI_HMAC_KEY_FILE:runtime/rmi-hmac.key}
  timeout: ${RMI_TIMEOUT:PT5S}
ocr:
  api-url: ${OCR_API_URL:}
  token: ${OCR_API_TOKEN:}
  max-bytes: ${OCR_MAX_BYTES:5242880}
  timeout: ${OCR_TIMEOUT:PT10S}
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp
