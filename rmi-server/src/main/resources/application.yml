spring:
  application:
    name: secure-grade-rmi-server
  main:
    web-application-type: none
  datasource:
    url: ${GRADE_DB_URL:jdbc:h2:file:./runtime/grade-management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${GRADE_DB_USERNAME:sa}
    password: ${GRADE_DB_PASSWORD:}
    driver-class-name: ${GRADE_DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: ${GRADE_DB_INIT_MODE:always}
      encoding: UTF-8

rmi:
  host: ${RMI_HOST:127.0.0.1}
  bind-address: ${RMI_BIND_ADDRESS:127.0.0.1}
  registry-port: ${RMI_REGISTRY_PORT:1199}
  service-port: ${RMI_SERVICE_PORT:1200}
  tls-enabled: ${RMI_TLS_ENABLED:false}
  tls-required: ${RMI_TLS_REQUIRED:false}
  tls-need-client-auth: ${RMI_TLS_NEED_CLIENT_AUTH:true}
  hmac-secret: ${RMI_HMAC_SECRET:}
  hmac-key-file: ${RMI_HMAC_KEY_FILE:runtime/rmi-hmac.key}
  client-connect-timeout-millis: ${RMI_CLIENT_CONNECT_TIMEOUT_MILLIS:5000}
  client-read-timeout-millis: ${RMI_CLIENT_READ_TIMEOUT_MILLIS:5000}

security:
  request-max-age-seconds: ${RMI_REQUEST_MAX_AGE_SECONDS:300}
  max-page-size: ${RMI_MAX_PAGE_SIZE:500}
  max-transaction-commands: ${RMI_MAX_TRANSACTION_COMMANDS:200}
  grade-key: ${GRADE_DATA_KEY:}
  grade-key-file: ${GRADE_DATA_KEY_FILE:runtime/grade-data.key}

ledger:
  path: ${GRADE_LEDGER_FILE:runtime/grade-integrity.ledger}

logging:
  level:
    edu.chd.practice.rmi: INFO
