<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务监控中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #eee;
      padding: 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header { text-align: center; padding: 30px 0; }
    header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { color: #8892b0; font-size: 1rem; }

    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px 40px;
      text-align: center;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
    }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: #00d9ff; }
    .stat-label { font-size: 0.9rem; color: #8892b0; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .service-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .service-card:hover::before { opacity: 1; }
    .service-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(0, 217, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }
    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }
    .service-name { font-size: 1.3rem; font-weight: 600; color: #e6f1ff; }
    .service-instance { font-size: 0.8rem; color: #8892b0; margin-top: 4px; font-family: 'Courier New', monospace; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .status-badge.up { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .status-badge.down { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .service-url { font-size: 0.85rem; color: #8892b0; margin-top: 10px; font-family: 'Courier New', monospace; word-break: break-all; }
    .service-meta { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .meta-item { font-size: 0.8rem; color: #8892b0; }
    .meta-item span { color: #e6f1ff; font-weight: 500; }

    .footer { text-align: center; padding: 30px 0; color: #8892b0; font-size: 0.85rem; }
    .footer a { color: #00d9ff; text-decoration: none; }
    .last-update { display: inline-block; margin-top: 10px; padding: 5px 15px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; font-size: 0.8rem; }

    .loading { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0, 217, 255, 0.2);
      border-top-color: #00d9ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .config-panel { position: fixed; top: 20px; right: 20px; z-index: 100; }
    .config-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .config-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .config-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .config-modal.active { display: flex; }
    .config-content {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
    }
    .config-content h3 { margin-bottom: 20px; color: #00d9ff; }
    .config-group { margin-bottom: 15px; }
    .config-group label { display: block; margin-bottom: 5px; color: #8892b0; font-size: 0.9rem; }
    .config-group input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #eee;
      font-size: 1rem;
    }
    .config-group input:focus { outline: none; border-color: #00d9ff; }
    .config-actions { display: flex; gap: 10px; margin-top: 20px; }
    .config-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; }
    .btn-primary { background: linear-gradient(90deg, #00d9ff, #00ff88); color: #1a1a2e; font-weight: 600; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #eee; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    .alert {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(255, 71, 87, 0.9);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      z-index: 2000;
      transition: transform 0.3s ease;
    }
    .alert.show { transform: translateX(-50%) translateY(0); }
    .alert.success { background: rgba(0, 255, 136, 0.9); color: #1a1a2e; }

    @media (max-width: 768px) {
      header h1 { font-size: 1.8rem; }
      .stats { gap: 15px; }
      .stat-card { padding: 15px 25px; }
      .stat-value { font-size: 1.8rem; }
      .services-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>服务监控中心</h1>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="total-services">-</div>
        <div class="stat-label">总服务数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="online-services" style="color: #00ff88;">-</div>
        <div class="stat-label">在线服务</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="offline-services" style="color: #ff4757;">-</div>
        <div class="stat-label">离线服务</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-instances">-</div>
        <div class="stat-label">实例总数</div>
      </div>
    </div>

    <div id="services-container" class="services-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>正在加载服务状态...</p>
      </div>
    </div>

    <div class="footer">
      <div class="last-update" id="last-update">最后更新: --</div>
    </div>
  </div>

  <div class="config-panel">
    <button class="config-btn" onclick="openConfig()">⚙ 设置</button>
  </div>

  <div class="config-modal" id="config-modal">
    <div class="config-content">
      <h3>系统配置</h3>
      <div class="config-group">
        <label for="refresh-interval">刷新间隔 (秒)</label>
        <input type="number" id="refresh-interval" placeholder="5" value="5" min="1" max="60">
      </div>
      <div class="config-actions">
        <button class="btn-secondary" onclick="closeConfig()">取消</button>
        <button class="btn-primary" onclick="saveConfig()">保存</button>
      </div>
    </div>
  </div>

  <div class="alert" id="alert"></div>

  <script>
    // 页面由网关提供服务，API 使用相对路径
    let refreshInterval = parseInt(localStorage.getItem('monitor_refresh_interval')) || 5;
    let pollTimer = null;

    async function fetchHealth() {
      try {
        const response = await fetch('/health');
        if (response.ok) {
          const data = await response.json();
          updateUI(data);
        } else {
          showError('获取服务状态失败 (HTTP ' + response.status + ')');
        }
      } catch (error) {
        showError('无法连接到服务: ' + error.message);
      }
    }

    function updateUI(data) {
      const services = data.services || [];
      const now = new Date().toLocaleString('zh-CN');
      
      document.getElementById('last-update').textContent = '最后更新: ' + now;
      
      // 更新统计
      const onlineCount = services.filter(s => s.status === 'UP' || !s.status).length;
      const offlineCount = services.filter(s => s.status === 'DOWN').length;
      
      document.getElementById('total-services').textContent = services.length;
      document.getElementById('online-services').textContent = onlineCount;
      document.getElementById('offline-services').textContent = offlineCount;
      document.getElementById('total-instances').textContent = services.length;
      
      // 按服务名分组
      const serviceMap = new Map();
      services.forEach(s => {
        if (!serviceMap.has(s.service)) {
          serviceMap.set(s.service, []);
        }
        serviceMap.get(s.service).push(s);
      });
      
      // 渲染服务卡片
      const container = document.getElementById('services-container');
      container.innerHTML = '';
      
      if (services.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #8892b0;">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p style="margin-top: 20px;">暂无服务注册</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">请确保所有服务已启动并注册到网关</p>
          </div>
        `;
        return;
      }
      
      serviceMap.forEach((instances, serviceName) => {
        const isOnline = instances.every(s => s.status !== 'DOWN');
        const card = document.createElement('div');
        card.className = 'service-card';
        
        card.innerHTML = `
          <div class="service-header">
            <div>
              <div class="service-name">${serviceName}</div>
              <div class="service-instance">${instances.map(i => i.instance).join(', ')}</div>
            </div>
            <div class="status-badge ${isOnline ? 'up' : 'down'}">
              <span class="status-dot"></span>
              ${isOnline ? '运行中' : '离线'}
            </div>
          </div>
          <div class="service-url">${instances.map(i => i.url).join('<br>')}</div>
          <div class="service-meta">
            <div class="meta-item">实例数: <span>${instances.length}</span></div>
            <div class="meta-item">状态: <span>${isOnline ? '正常' : '异常'}</span></div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    function showError(message) {
      document.getElementById('services-container').innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <p style="margin-top: 20px; color: #ff4757;">${message}</p>
          <p style="margin-top: 10px; font-size: 0.9rem; color: #8892b0;">请检查服务状态</p>
        </div>
      `;
    }

    function openConfig() {
      document.getElementById('refresh-interval').value = refreshInterval;
      document.getElementById('config-modal').classList.add('active');
    }

    function closeConfig() {
      document.getElementById('config-modal').classList.remove('active');
    }

    function saveConfig() {
      refreshInterval = parseInt(document.getElementById('refresh-interval').value) || 5;
      localStorage.setItem('monitor_refresh_interval', refreshInterval);
      closeConfig();
      showAlert('配置已保存', 'success');
      refreshData();
    }

    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = 'alert ' + type;
      alert.classList.add('show');
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 3000);
    }

    function refreshData() {
      fetchHealth();
    }

    // 事件监听
    document.getElementById('config-modal').addEventListener('click', function(e) {
      if (e.target === this) closeConfig();
    });

    // 开始轮询
    refreshData();
    pollTimer = setInterval(refreshData, refreshInterval * 1000);

    // 页面不可见时暂停轮询
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        clearInterval(pollTimer);
      } else {
        refreshData();
        pollTimer = setInterval(refreshData, refreshInterval * 1000);
      }
    });
  </script>
</body>
</html>
